[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = false

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# Start narrow: prevent syntax/undefined-name issues in new support code,
# without quietly reformatting the legacy engine as a side effect.
select = ["E4", "E7", "E9", "F"]
