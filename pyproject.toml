[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "littlebigengine"
version = "0.1.0"
description = "A composable Python engine with persistent resources and an independent editor."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
editor = ["dearpygui"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
lbe = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["LBE*", "editor*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = false

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# Start narrow: prevent syntax/undefined-name issues in new support code,
# without quietly reformatting the legacy engine as a side effect.
select = ["E4", "E7", "E9", "F"]
