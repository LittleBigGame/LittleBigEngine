name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python tests/run_suite.py -v
      - run: python -m lbe --check
      - run: lbe --check
      - run: python main.py --check
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - run: python -m pip install '.[desktop]'
      - run: python tests/run_suite.py -v
      - run: python -m lbe --headless --frames 3
      - run: python tests/desktop_walkthrough.py
      - run: python tests/editor_completion_smoke.py --selection
      - run: python tests/desktop_soak.py --seconds 90
      - run: python -m lbe --template counter --headless --frames 3
      - run: python -m lbe --template demo --headless --frames 3
